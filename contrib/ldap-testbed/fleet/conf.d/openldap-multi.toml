# openldap fleet server — generated by fleet.sh confd
[server]
name         = "openldap-multi"
host         = "localhost"
port         = 3392
use_ssl      = false
base_dn      = "dc=north,dc=example"
bind_dn      = "cn=admin,dc=north,dc=example"
password_cmd = "printf secret"
verify       = false

[[domain]]
base_dn      = "dc=south,dc=example"
bind_dn      = "cn=admin,dc=south,dc=example"
