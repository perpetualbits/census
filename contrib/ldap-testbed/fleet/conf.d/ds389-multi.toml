# ds389 fleet server — generated by fleet.sh confd
[server]
name         = "ds389-multi"
host         = "localhost"
port         = 3395
use_ssl      = false
base_dn      = "dc=east,dc=example"
bind_dn      = "cn=Directory Manager"
password_cmd = "printf secret389"
verify       = false

[[domain]]
base_dn      = "dc=west,dc=example"
