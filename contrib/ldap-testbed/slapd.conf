# Classic slapd.conf, converted to cn=config by slaptest at first boot.
# Baked into the server image at /etc/census/slapd.conf.
#
# NOTE: the classic parser does NOT allow inline comments after a directive
# value ("sssvlv-max 100 # ..." fails with 'extra cruft'). Keep comments on
# their own lines.

# Schema shipped in the debian slapd image:
include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema
include /etc/ldap/schema/nis.schema
# Custom schema (baked into the image alongside this file):
include /etc/census/schema/openssh-lpk.schema
include /etc/census/schema/sortkey.schema

pidfile  /var/run/slapd/slapd.pid
argsfile /var/run/slapd/slapd.args

modulepath /usr/lib/ldap
moduleload back_mdb
moduleload sssvlv

database mdb
maxsize  68719476736
suffix   "dc=census,dc=test"
rootdn   "cn=admin,dc=census,dc=test"
# Plaintext rootpw — this is a throwaway local test server.
rootpw   census

directory /var/lib/ldap

# Let clients pull large result sets (census pages through millions of users).
sizelimit unlimited
timelimit unlimited

# Indexes tuned for census: identity lookups + membership + name search.
# `sortRank eq` is what makes the ordered browse fast — but it MUST be built by
# slapadd during the bulk load, never afterward with slapindex (see the docs:
# LMDB's random-write reindex thrashes on ZFS).
index objectClass eq
index uid         eq
index uidNumber   eq
index gidNumber   eq
index memberUid   eq
index sortRank    eq
index cn          eq,sub
index sn          eq,sub
index givenName   eq,sub
index mail        eq,sub

# Anonymous read is fine for a local test corpus.
access to * by * read

# Server-Side Sorting (RFC 2891) + Virtual List View — lets census page through
# millions of users in a stable sorted order. Browse by sortRank for speed.
overlay sssvlv
sssvlv-max 100
sssvlv-maxkeys 5
sssvlv-maxperconn 50
